version: 1.0

scans:
  - name: "Security Scan"
    type: "security"
    schedule: "daily"
    targets:
      - "src/**/*.{js,jsx,ts,tsx}"
      - "terraform/**/*.tf"
    rules:
      - "no-secrets-in-code"
      - "no-weak-crypto"
      - "no-unsafe-eval"
      - "no-unsafe-regex"
      - "no-unsafe-imports"
      - "no-unsafe-assignments"
      - "no-unsafe-calls"
      - "no-unsafe-properties"
      - "no-unsafe-constructors"
      - "no-unsafe-destructuring"

  - name: "Infrastructure Scan"
    type: "infrastructure"
    schedule: "daily"
    targets:
      - "terraform/**/*.tf"
    rules:
      - "no-public-s3-buckets"
      - "no-public-security-groups"
      - "no-public-ip-addresses"
      - "no-public-ports"
      - "no-public-subnets"
      - "no-public-routes"
      - "no-public-load-balancers"
      - "no-public-elastic-ips"
      - "no-public-elastic-load-balancers"
      - "no-public-elastic-ip-addresses"

notifications:
  - type: "slack"
    channel: "#security-alerts"
    events:
      - "scan-completed"
      - "vulnerability-found"
      - "critical-vulnerability-found" 